server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep this in step with contentSecurityPolicy(false) in csp.ts.
  # MUI injects styles at runtime, so style-src allows inline CSS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https: wss:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # SPA routing
  location / {
    try_files $uri /index.html;
  }

  # Long cache for hashed assets
  location ~* \.(?:css|js|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker must be served fresh
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /workbox-*.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
}
