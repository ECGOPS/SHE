[build]
  command = "npm ci && npm run build --workspace=@ecg-she/web"
  publish = "apps/web/dist"

# Same-host API so iPhone Safari keeps the CSRF cookie. Safari blocks cookies
# from another site (the page on Netlify, the API on Render).
[[redirects]]
  from = "/api/v1/*"
  to = "https://ecg-she-api.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Let the phone fetch a new service worker and HTML after each deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
