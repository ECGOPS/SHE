name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecg_she
          POSTGRES_PASSWORD: ecg_she_dev
          POSTGRES_DB: ecg_she
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ecg-she/shared

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Type-check (API)
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type-check (Web)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test --workspaces --if-present
        env:
          DB_HOST: localhost
          DB_USERNAME: ecg_she
          DB_PASSWORD: ecg_she_dev
          DB_NAME: ecg_she
          JWT_ACCESS_SECRET: test-access-secret-with-min-32-chars-here
          JWT_REFRESH_SECRET: test-refresh-secret-with-min-32-chars-her
          DATA_ENCRYPTION_KEY: test-data-encryption-key-32-chars

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
